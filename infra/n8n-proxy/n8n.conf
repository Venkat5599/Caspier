server {
  listen 8089;
  # Disable upstream compression so sub_filter can rewrite HTML.
  proxy_set_header Accept-Encoding "";

  location / {
    proxy_pass http://127.0.0.1:5678;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "frame-ancestors 'self' http://187.127.137.136:8087 http://187.127.137.136:8089" always;

    # Strip n8n branding (logo) inside the embedded editor.
    sub_filter '</head>' '<style>.logo,.logo-wrapper,#header .logo,#sidebar .logo,a[href="/"] img,img[alt="n8n"]{display:none!important}</style></head>';
    sub_filter_once on;
    sub_filter_types text/html;

    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
  }
}
