server {
  listen 8089;
  proxy_set_header Accept-Encoding "";

  location / {
    proxy_pass http://n8n:5678;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:5173 http://127.0.0.1:5173 https://*.vercel.app *" always;

    sub_filter '</head>' '<style>.logo,.logo-wrapper,#header .logo,#sidebar .logo,a[href="/"] img,img[alt="n8n"]{display:none!important}</style></head>';
    sub_filter_once on;
    sub_filter_types text/html;

    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
  }
}
