# Agent Fabric — local / VPS dependency stack + n8n workflow engine.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fabric
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabric}
      POSTGRES_DB: fabric
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabric"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

  nats:
    image: nats:2-alpine
    command: ["-js"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-fabric}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-fabricfabric}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  n8n:
    image: n8nio/n8n:0.148.0
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      N8N_USER_FOLDER: /home/node
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  n8n-proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${N8N_PROXY_PORT:-8089}:8089"
    volumes:
      - ../n8n-proxy/n8n.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n

volumes:
  pgdata:
  redisdata:
  miniodata:
  n8ndata:
