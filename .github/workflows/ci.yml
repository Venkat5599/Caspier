name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fabric
          POSTGRES_PASSWORD: fabric
          POSTGRES_DB: fabric
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fabric"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://fabric:fabric@localhost:5432/fabric

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Migrate database
        run: bun services/catalog/src/migrate.ts

      - name: Test
        run: bun run test
